name: Feedback
description: Leave feedback, suggest ideas or report issues for MacWall
title: "[Feedback] "
labels: ["feedback"]
body:
  - type: dropdown
    id: type
    attributes:
      label: Feedback type
      options:
        - Suggestion
        - Issue report
        - Content feedback
        - Other
    validations:
      required: true
  - type: textarea
    id: content
    attributes:
      label: Message
      description: Write anything here — it is publicly visible.
      placeholder: e.g. Please add a XX effect / I ran into XX issue on macOS 15 / Love this wallpaper…
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MacWall version (optional)
      placeholder: e.g. 0.2.0
  - type: input
    id: contact
    attributes:
      label: Contact (optional)
      description: Leave an email if you would like a private reply.
      placeholder: e.g. name@example.com
